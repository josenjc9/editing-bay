<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>*{margin:0;padding:0}html,body{width:1920px;height:1080px;overflow:hidden;background:#0b0f14}
#root{position:relative;width:100%;height:100%}canvas{display:block}</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
 <canvas id="c" class="clip" width="1920" height="1080" data-start="0" data-duration="6" data-track-index="0"></canvas>
</div>
<script>
const canvas=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setSize(1920,1080,false);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0f14);
const cam=new THREE.PerspectiveCamera(40,1920/1080,0.1,100);
const mesh=new THREE.Mesh(new THREE.TorusKnotGeometry(1,0.32,160,24),new THREE.MeshStandardMaterial({color:0xe8a33d,roughness:0.5,metalness:0.2}));
scene.add(mesh);
const key=new THREE.DirectionalLight(0xffd9a8,2.2);key.position.set(3,4,5);scene.add(key);
const rim=new THREE.DirectionalLight(0x7fb2ff,1.6);rim.position.set(-4,1,-3);scene.add(rim);
scene.add(new THREE.AmbientLight(0x223344,0.6));
function renderAt(t){
  // pure function of t: slow dive from z=6 to z=3.2, object turns with t
  const k=Math.min(t/5,1), e=1-Math.pow(1-k,3);
  cam.position.set(0,0.4,6-2.8*e);cam.lookAt(0,0,0);
  mesh.rotation.set(0.3,t*0.6,0);
  renderer.render(scene,cam);
}
window.addEventListener("hf-seek",(e)=>{renderAt(e.detail.time)});
renderAt(0);
// the scene is driven by hf-seek; an empty timeline only registers the composition
window.__timelines = window.__timelines || {};
window.__timelines["main"] = gsap.timeline({ paused: true });
</script></body></html>
